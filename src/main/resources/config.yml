# =====================================================================
# AuraCamp Main Configuration File
# =====================================================================

# Language setting for the plugin localization files ('en_US' or 'ru_RU')
language: "en_US"

# Whether to use custom resource pack characters for GUI titles
use-resource-pack: false

# Message output mode: CHAT, ACTIONBAR, or BOTH
message-output: "BOTH"

# =====================================================================
# PvP & Combat Settings
# =====================================================================
pvp:
  # Duration in seconds that a player remains "in combat"
  combat-tag-seconds: 15
  # Disable campfire healing while in combat
  disable-healing-in-combat: true
  # Block waypoint compass teleportation while in combat
  disable-teleport-in-combat: true
  # Allow enemy players to damage campfire shields
  allow-extinguish-enemy-camp: true

# =====================================================================
# Campfire Base Levels (1 - 3)
# Note: Reaching Level 3 removes base potion effects and unlocks the Shop!
# =====================================================================
levels:
  1:
    radius: 6.0
    heal-amount: 1.0
    heal-interval-seconds: 4
    max-members: 3
    effect: "REGENERATION"
    effect-amplifier: 0

  2:
    radius: 12.0
    heal-amount: 1.5
    heal-interval-seconds: 3
    max-members: 5
    effect: "REGENERATION"
    effect-amplifier: 1
    upgrade-cost:
      material: COPPER_INGOT
      amount: 16

  3:
    radius: 18.0
    heal-amount: 2.0
    heal-interval-seconds: 2
    max-members: 8
    allow-compass-bind: true
    upgrade-cost:
      material: AMETHYST_SHARD
      amount: 16

# =====================================================================
# Level 3 Campfire Shop Settings
# =====================================================================
shop:
  currency: DIAMOND

  effects:
    regeneration:
      cost: 5
      amplifier: 0
    fire-resistance:
      cost: 8
      amplifier: 0

  protections:
    mob-protection:
      cost: 25
    full-protection:
      cost: 64

  radius-upgrades:
    tier-1:
      cost: 16
      radius: 24.0
    tier-2:
      cost: 32
      radius: 42.0
    tier-3:
      cost: 64
      radius: 100.0

  member-upgrades:
    tier-1:
      cost: 50
      max-members: 12
    tier-2:
      cost: 100
      max-members: 16