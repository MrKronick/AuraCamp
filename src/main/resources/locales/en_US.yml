prefix: "<gradient:#ff7b00:#ffb700><b>[AuraCamp]</b></gradient> "
no-permission: "<red>You do not have permission to execute this command."
reload-success: "<green>Configuration and localization files successfully reloaded!"
camp-upgraded: "<green>✨ Campfire upgraded to level <yellow>%level%</yellow>!"
camp-max-unlocked: "<gold>⚡ Max level reached! Base effects cleared. <aqua>Campfire Shop</aqua> is now unlocked!"
not-enough-items: "<red>Not enough items! Required: <gold>%amount%x %item%</gold>."
already-purchased: "<yellow>You have already purchased this upgrade!"
shop-purchased: "<green>✔ Successfully purchased: <aqua>%item%</aqua>!"
compass-bound: "<green>🧭 Compass bound to this campfire!"
compass-teleported: "<aqua>⚡ Teleported to your campfire!"
enemy-extinguished: "<red>🛡️ Enemy campfire shield absorbed the damage!"
shield-toggled-on: "<green>🟢 Campfire shield enabled."
shield-toggled-off: "<yellow>🔴 Campfire shield disabled."

actionbar-combat: "<red>⚔ You are in combat! Aura & teleport blocked."
actionbar-healing: "<green>🔥 Campfire aura is healing you..."

team:
  usage: "<yellow>Usage: /cp team <add|remove|list> [player]"
  not-standing-near: "<red>You must stand within 6 blocks of your own campfire!"
  not-owner: "<red>Only the campfire owner can manage the team!"
  player-not-found: "<red>Player not found or offline."
  already-in-team: "<yellow>This player is already in your campfire team!"
  not-in-team: "<red>This player is not in your team!"
  limit-reached: "<red>Team limit reached (<yellow>%max%</yellow> players)! Upgrade limit in the Campfire Shop."
  added: "<green>Player <yellow>%player%</yellow> added to your campfire team!"
  removed: "<yellow>Player <red>%player%</red> removed from your campfire team."
  list-header: "<gold>--- Campfire Team (<yellow>%count%/%max%</yellow>) ---"
  list-entry: "<gray>- <white>%player%"

gui:
  title-vanilla: "<dark_gray>Campfire Management (Lvl %level%)"
  title-shop: "<dark_gray>Campfire Shop (Lvl 3)"
  title-rp: "\uE001"
  upgrade-name: "<gradient:#ff7b00:#ffb700><b>Upgrade Campfire</b></gradient>"
  upgrade-lore:
    - "<gray>Current Level: <yellow>%level%/3"
    - "<gray>Cost: <aqua>%amount% %item%"
    - ""
    - "<green>▶ Click to upgrade!"
  shop-button-name: "<gradient:#00d2ff:#3a7bd5><b>Open Campfire Shop</b></gradient>"
  shop-button-lore:
    - "<gray>Buy permanent potion effects,"
    - "<gray>mob/PvP immunity, radius,"
    - "<gray>and team slots!"
    - ""
    - "<yellow>▶ Click to open Shop"
  compass-name: "<aqua><b>Bind Waypoint Compass</b>"
  compass-lore:
    - "<gray>Hold a compass in your main hand"
    - "<gray>and click to bind it here."
  shield-on-name: "<green><b>Campfire Shield: ON</b>"
  shield-off-name: "<red><b>Campfire Shield: OFF</b>"
  shield-lore:
    - "<gray>Click to toggle campfire"
    - "<gray>physical protection."
  back-button: "<red>◀ Back to Main Menu"

shop-items:
  regen-name: "<light_purple><b>Effect: Regeneration</b>"
  fire-res-name: "<gold><b>Effect: Fire Resistance</b>"
  mob-prot-name: "<green><b>Protection: Anti-Mob Aggro</b>"
  full-prot-name: "<aqua><b>Protection: Full Immunity (PvP & Mobs)</b>"
  radius-name: "<yellow><b>Expand Aura Radius (%radius% blocks)</b>"
  members-name: "<blue><b>Expand Team Limit (%max% players)</b>"
  status-locked: "<gray>Cost: <aqua>%cost% Diamonds\n\n<green>▶ Click to purchase!"
  status-unlocked-active: "<green>✔ Purchased & ACTIVE\n<gray>Click to toggle OFF"
  status-unlocked-inactive: "<red>✖ Purchased (INACTIVE)\n<gray>Click to toggle ON"
  status-maxed: "<gold>★ MAXED OUT"